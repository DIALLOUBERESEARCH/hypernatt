# GitHub Actions — hypernatt-audit-public
# Automated Cryptographic Proof & Ledger Integrity Check
# Synced from DIALLOUBE-RESEARCH monorepo

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify-ledger-sha256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Cryptographic Audit Verification
        run: node scripts/verify_ledger.mjs
